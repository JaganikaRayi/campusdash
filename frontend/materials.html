<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Materials & Lecture Notes – CampusDash</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold" href="dashboard.html">
        <span class="brand-badge"><i class="fas fa-graduation-cap me-1"></i> CampusDash</span>
      </a>
      <div id="nav-user-info"></div>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i> <span>Dashboard</span></a>
      <a href="attendance.html" class="nav-item"><i class="fas fa-calendar-check"></i> <span>Attendance</span></a>
      <a href="fees.html" class="nav-item"><i class="fas fa-receipt"></i> <span>Fees & Receipts</span></a>
      <a href="timetable.html" class="nav-item"><i class="fas fa-calendar-alt"></i> <span>Timetable</span></a>
      <a href="results.html" class="nav-item"><i class="fas fa-poll"></i> <span>Exam Results</span></a>
      <a href="materials.html" class="nav-item active"><i class="fas fa-book-open"></i> <span>Study Materials</span></a>
      <a href="faculty.html" class="nav-item"><i class="fas fa-chalkboard-teacher"></i> <span>Faculty Directory</span></a>
      <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i> <span>Notifications</span></a>
      <a href="leave.html" class="nav-item"><i class="fas fa-paper-plane"></i> <span>Leave Requests</span></a>
      <div class="my-2 border-top border-secondary border-opacity-25"></div>
      <a href="algorithms.html" class="nav-item" style="color: #38bdf8;"><i class="fas fa-microchip"></i> <span>ADS Visualizer (9)</span></a>
    </aside>

    <main class="main-content">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h3 class="fw-bold text-white mb-1"><i class="fas fa-book-open text-info me-2"></i> Course Study Materials</h3>
          <p class="text-muted small mb-0">Official unit notes, algorithmic cheat sheets, and laboratory assignments</p>
        </div>
        <div>
          <button class="btn btn-campus btn-sm" data-bs-toggle="modal" data-bs-target="#uploadMaterialModal">
            <i class="fas fa-upload me-1"></i> Upload Material
          </button>
        </div>
      </div>

      <!-- Materials List Grid -->
      <div class="row g-3" id="materials-container">
        <div class="col-12 text-center py-4 text-muted"><i class="fas fa-spinner fa-spin"></i> Loading materials...</div>
      </div>
    </main>
  </div>

  <!-- Upload Modal -->
  <div class="modal fade" id="uploadMaterialModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content modal-content-campus">
        <div class="modal-header border-secondary border-opacity-25">
          <h5 class="modal-title text-white"><i class="fas fa-file-upload text-primary me-2"></i> Upload Study Material</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="handleUploadMaterial(event)">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label text-muted small">Document Title</label>
              <input type="text" class="form-control form-control-campus" id="mat-title" placeholder="e.g. Unit 3 - Dynamic Programming Notes" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Subject Code</label>
              <select class="form-select form-control-campus" id="mat-subject">
                <option value="CS301">CS301 - Advanced Data Structures</option>
                <option value="CS302">CS302 - Python Programming</option>
                <option value="CS303">CS303 - Java Programming</option>
                <option value="BS301">BS301 - Discrete Mathematics</option>
                <option value="ES301">ES301 - Engineering Science</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Resource Link / File URL</label>
              <input type="url" class="form-control form-control-campus" id="mat-url" value="https://campusdash.edu/materials/notes.pdf" required>
            </div>
            <div class="mb-3">
              <label class="form-label text-muted small">Brief Description</label>
              <textarea class="form-control form-control-campus" id="mat-desc" rows="2" placeholder="Summary of topics covered..."></textarea>
            </div>
          </div>
          <div class="modal-footer border-secondary border-opacity-25">
            <button type="button" class="btn btn-outline-campus btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success-campus btn-sm"><i class="fas fa-check me-1"></i> Upload Document</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Auth.checkAuth(true);
      await loadMaterials();
    });

    async function loadMaterials() {
      const container = document.getElementById('materials-container');
      try {
        const res = await API.get('/materials');
        if (!res.success) return;

        if (res.materials.length === 0) {
          container.innerHTML = `<div class="col-12 text-center text-muted py-4">No materials uploaded yet.</div>`;
          return;
        }

        container.innerHTML = res.materials.map(m => `
          <div class="col-md-6 col-lg-4">
            <div class="glass-panel p-3 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <span class="badge bg-primary bg-opacity-25 text-primary border border-primary">${m.subject_code}</span>
                  <small class="text-muted"><i class="far fa-clock me-1"></i> Sem ${m.semester}</small>
                </div>
                <h6 class="fw-bold text-white mb-2">${m.title}</h6>
                <p class="text-muted small mb-3">${m.description || 'Comprehensive notes and tutorial materials.'}</p>
              </div>
              <div class="pt-2 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                <small class="text-dim"><i class="fas fa-user-edit me-1"></i> ${m.uploaded_by}</small>
                <a href="${m.file_url}" target="_blank" class="btn btn-outline-campus btn-sm py-1 px-2" style="font-size:0.8rem;">
                  <i class="fas fa-download text-info me-1"></i> Access PDF
                </a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function handleUploadMaterial(e) {
      e.preventDefault();
      const user = Auth.getUser();
      const title = document.getElementById('mat-title').value;
      const sub = document.getElementById('mat-subject').value;
      const url = document.getElementById('mat-url').value;
      const desc = document.getElementById('mat-desc').value;

      try {
        const res = await API.post('/materials', {
          title: title,
          subject_code: sub,
          file_url: url,
          description: desc,
          uploaded_by: user ? user.name : 'Faculty'
        });

        if (res.success) {
          showToast(res.message, 'success');
          const modalEl = document.getElementById('uploadMaterialModal');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
          loadMaterials();
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
